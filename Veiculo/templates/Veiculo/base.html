{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RotaSaúde{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'Veiculo/css/app.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark rs-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="{% url 'lista_veiculos' %}">
        <span class="rs-brand-mark"><i class="bi bi-heart-pulse"></i></span>
        RotaSaúde
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'lista_veiculos' %}active{% endif %}" href="{% url 'lista_veiculos' %}">Veículos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'novo_veiculo' %}active{% endif %}" href="{% url 'novo_veiculo' %}">Novo veículo</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container rs-page flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="rs-footer py-3 mt-auto">
    <div class="container text-center">
      RotaSaúde — frota de transporte assistencial
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
