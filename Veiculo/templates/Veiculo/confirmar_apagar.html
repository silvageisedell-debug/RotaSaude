{% extends "Veiculo/base.html" %}

{% block title %}Confirmar exclusão · RotaSaúde{% endblock %}

{% block content %}
<!-- Bootstrap 5 nesta confirmação (card, botões, CSRF) aplicado com apoio de IA. -->
<div class="row justify-content-center">
  <div class="col-lg-6 col-xl-5">
    <div class="card rs-card">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-3">Confirmar exclusão</h1>
        <p>Apagar o veículo {{ veiculo.placa }} — {{ veiculo.modelo }}?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-danger">Sim, apagar</button>
            <a class="btn btn-outline-secondary" href="{% url 'lista_veiculos' %}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
