{% extends "Veiculo/base.html" %}

{% block title %}Entrar · RotaSaúde{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card rs-card">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-1">Entrar</h1>
        <p class="text-secondary mb-4">Administrador vê a frota e as métricas. Atendente publica disponibilidade e rota.</p>
        {% if erro %}
        <div class="alert alert-danger" role="alert">{{ erro }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="username">E-mail</label>
            <input class="form-control" id="username" name="username" type="email" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Senha</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-rs w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
